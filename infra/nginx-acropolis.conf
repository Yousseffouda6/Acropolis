# Acropolis — nginx reverse proxy with hybrid post-quantum TLS.
# ----------------------------------------------------------------------------
# Front door introduced in Phase 5 (a reverse proxy for the web-layer attacks)
# and migrated to a HYBRID POST-QUANTUM key exchange in Phase 7. nginx terminates
# TLS 1.3 and proxies to the Acropolis Notes app bound to loopback
# (127.0.0.1:5000 — see infra/deploy.md §4), so nginx is the only component that
# faces the network.
#
# The hybrid key exchange (X25519MLKEM768 = classical X25519 + ML-KEM-768) needs
# OpenSSL 3.5+; the lab host runs OpenSSL 3.5.5, which has native ML-KEM support
# (no external provider required). Verify a real handshake with:
#
#   openssl s_client -connect localhost:443 -groups X25519MLKEM768
#   # -> Negotiated TLS1.3 group: X25519MLKEM768
#
# See writeups/phase-7-pqc.md for the threat model and the crypto inventory.
# ----------------------------------------------------------------------------

# Redirect all plaintext HTTP to HTTPS.
server {
    listen      80;
    listen      [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # Self-signed lab certificate (a real deployment uses an ACME/CA-issued cert).
    ssl_certificate     /etc/nginx/tls/acropolis.crt;
    ssl_certificate_key /etc/nginx/tls/acropolis.key;

    # --- Hybrid post-quantum TLS (Phase 7) --------------------------------- #
    # TLS 1.3 only, and lead the key-exchange group list with the hybrid
    # X25519MLKEM768; classical X25519 stays as a fallback for older clients.
    ssl_protocols             TLSv1.3;
    ssl_ecdh_curve            X25519MLKEM768:X25519;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;

    # Baseline security headers (defense in depth; also clears passive DAST warnings).
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "no-referrer"      always;

    # Proxy to the loopback-bound app (the Phase 3 binding is preserved).
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
