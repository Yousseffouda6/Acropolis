<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Acropolis Notes{% endblock %}</title>
  <meta name="description" content="Acropolis Notes - a calm, Markdown-first place to keep your thinking.">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block layout %}{% endblock %}

  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast toast--{{ category }}" role="status">
          <span>{{ message }}</span>
          <button class="toast__close" type="button" aria-label="Dismiss">&times;</button>
        </div>
      {% endfor %}
    {% endwith %}
  </div>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
